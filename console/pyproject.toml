[project]
name = "sma-console"
version = "0.0.1"
description = "The operator console: shows what the four agents have on disk, drafts plans the person approves, commands nothing"
requires-python = ">=3.12,<3.13"
# What the console's code imports, read off its import graph (card 001), not off dino's manifest.
# numpy is imported by the data layer's simulation and run readers. No torch, no pymmcore and no
# scipy: an environment without pymmcore cannot open a Micro-Manager core, which is the guarantee
# console/.claude/settings.json cannot give.
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=10",
    "anthropic>=1.11.0",
    "gsd>=5.0",
]

[dependency-groups]
# httpx2: the HTTP client starlette.testclient wants since starlette 1.x
dev = ["pytest>=8", "ruff>=0.6", "httpx2>=2.13"]
# Node for the React build in web/, so it needs no system Node. Not a default group: a plain
# `uv sync` stays small, and building web/ is a later card's step.
web = [
    "nodejs-wheel>=22,<23",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dino_autofocus"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["dino_autofocus"]
