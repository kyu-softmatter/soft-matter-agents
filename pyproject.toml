# contracts/ is installed into every pixi environment as an editable package,
# so agent code can `import contracts` from its own directory. Before
# 2026-09-23 that import failed with ModuleNotFoundError everywhere except the
# repository root, and seats worked around it by rounding numbers their own way
# or by pushing the repository root onto sys.path -- which also exposes every
# other agent's directory to import. This build exposes contracts and nothing
# else: setuptools' editable finder maps exactly the packages listed below,
# measured in a scratch copy (import contracts works from an agent directory;
# import simulation_agent, microscope_agent, librarian_agent and bridge all
# fail). contracts has no __init__.py and is installed as a namespace package.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contracts"]

# setuptools writes an .egg-info directory into the project root during an
# editable build. At the root it is an undeclared path, and the first install
# on 2026-09-23 made check 13 fail for every seat's bare run until it was
# removed -- the shape .pixi/ had that morning. egg_base moves it into .pixi/,
# which .gitignore and SKIP_DIRS already exclude. It assumes installs go
# through pixi, which creates .pixi/ before building; a bare `pip install -e .`
# without .pixi/ present is not a supported path.
[tool.distutils.egg_info]
egg_base = ".pixi"

[project]
name = "soft-matter-agents"
version = "0.1.0"
description = "Contracts and agent code for the four soft-matter agents. Not published; this file exists so a second machine resolves the same versions."
requires-python = ">=3.11"

# Everything the tree imports that is not stdlib. Counted from the source with
# an AST walk over every .py outside .venv, not listed from memory: six, of
# which this list held three until 2026-09-22. See section 7.
dependencies = [
  "jsonschema>=4.0",   # check 1 validates every card against contracts/schemas/
  "referencing>=0.30", # the $ref registry check 1 builds; jsonschema does not pull it for this use
  "numpy>=1.26",       # mock_backend integrates in SI with it
]

# mcp and pymmcore-plus are imported and are NOT in the list above, because
# this list is what `uv` can resolve and the two of them belong with the conda
# side below. pymmcore-plus is imported by microscope_agent and is not
# installed on this machine at all. HOOMD-blue cannot go here under any
# circumstances: it is not on PyPI under any of its three names.

# ---------------------------------------------------------------------------
# pixi: the conda side. Chosen by the person on 2026-09-22 over environment.yml
# because it is the only tool that states conda-forge and PyPI in one lockfile
# AND states a different dependency set per platform, which this repository
# needs -- win-64 has no HOOMD build at all.
#
# SOLVED ON 2026-09-23, and the first attempt failed. These tables were written
# as a specification while pixi was not installed; the comment here said so, and
# saying so was worth it -- `pixi lock` refused the `mic` environment because
# conda-forge builds no `pymmcore` for osx-arm64. The fix is the pypi-dependencies
# table further down. pixi.lock is now in the tree, `pixi install -e sim` stands,
# and contracts/validate.py runs under that interpreter.
#
# Measured by dry-run solve on 2026-09-22 against conda-forge, and confirmed by
# the lock on 2026-09-23:
#
#   package         osx-arm64   linux-64   win-64
#   hoomd 7.2.0     yes         yes        NO BUILD
#   pymmcore        NO BUILD    yes        yes        <- so pymmcore-plus is PyPI
#   mcp 2.2.0       noarch      noarch     noarch
#   jsonschema / referencing / numpy       all three platforms
#
#   hoomd 7.2.0 resolves with python 3.12 and 3.13 on both platforms that have
#   it. Unpinned it pulls python 3.14, which is why python is pinned below.
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
# win-64 is here for the microscope on the Windows host. The simulation engine
# does not exist for it; the engine lives in WSL2, which is linux-64.
platforms = ["osx-arm64", "linux-64", "win-64"]

# The repository itself, editable, into every environment -- see [build-system].
[tool.pixi.pypi-dependencies]
soft-matter-agents = { path = ".", editable = true }

[tool.pixi.dependencies]
python = "3.12.*"
jsonschema = ">=4.0"
referencing = ">=0.30"
numpy = ">=1.26"
mcp = ">=2.0"

# The simulation engine. Declared on the two platforms that have a build, so
# solving for win-64 does not fail -- it simply has no `sim` environment.
[tool.pixi.feature.sim]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.feature.sim.dependencies]
hoomd = ">=7.2"
gsd = ">=3.2"
# Added 2026-09-23 on the person's instruction, for the simulation seats now
# running, before anything imported it -- the difference from how gsd was
# once treated is who asked and why: the person provisioning sessions that are
# running, not a seat anticipating work that had not landed. Check 82 carries
# the asymmetry: an import with no declaration fails, a declaration with no
# import reports. This comment said check 79 until 2026-09-23; 79 compares
# .gitignore with SKIP_DIRS, and the wrong number is why nobody looked.
#
# The floor is what the work needs (root finding, quadrature, fitting --
# simulation-7 named 1.11), not what the lock happens to pin today. A floor
# of >=1.18 would assert that 1.11 through 1.17 do not work, which nobody
# has tested. pixi.lock pins 1.18.1 either way; the constraint is a claim
# and the lock is the fact.
scipy = ">=1.11"
# Added 2026-09-23 for the report generator the person asked for -- graphs,
# and pictures and video where possible, made from the trajectory files on
# disk (manager-simulation's task 022). matplotlib draws the figures; ffmpeg
# encodes short clips. Neither is imported yet, the scipy case again: the
# person provisioning running seats. No floor, because nothing in the work
# needs a particular version and a floor would assert one nobody tested.
matplotlib = "*"
ffmpeg = "*"

# The microscope's device layer. Imported by microscope_agent today and
# installed nowhere, which is the half of the manifest gap that bites first.
#
# It comes from PyPI and not conda-forge, and that is measured rather than
# preferred. conda-forge builds `pymmcore` -- the compiled MMCore binding that
# pymmcore-plus needs -- for linux-64 and win-64 only, so the conda route
# cannot be installed on this machine at all; the first `pixi lock` failed
# exactly there. PyPI carries both for all three platforms and is four minor
# versions ahead (0.18.1 against conda-forge's 0.12.0). This is the mirror of
# HOOMD, which has no win-64 build, and it is the case that justifies pixi
# over environment.yml: one lockfile, two channels, per platform.
[tool.pixi.feature.mic.pypi-dependencies]
pymmcore-plus = ">=0.18"

# gsd was deliberately absent until 2026-09-23, on the grounds that declaring
# it before anything imported it would declare a reader that does not exist.
# The condition that comment set has fired: trajectory.py:81 imports gsd.hoomd
# and engine_check.py imports gsd.version twice. HOOMD does not pull it, so
# every sim run was writing no trajectory at all -- honestly recorded as
# written: false with a reason, which is why nothing went red and nobody
# noticed for a day. conda-forge has 5.0.1 on both sim platforms.

[tool.pixi.environments]
sim = ["sim"]
mic = ["mic"]
