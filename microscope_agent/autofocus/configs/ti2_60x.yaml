# Nikon Ti2-E nosepiece position 4: CFI Plan Apo Lambda D 60X Oil (MRD71670), NA 1.42, oil,
# Photometrics Kinetix22 ("Kinetix_red") in the 16-bit Dynamic Range mode, aqueous sample
# on a #1.5 coverslip, widefield fluorescence with green excitation and ~605 nm emission.
#
# Sources (soft-matter-agents/librarian_agent/kb/entries):
#   NA, working distance      objective_mrd71670.json            spec:MRD71670 (catalogue)
#   pixel in sample 0.10833   pixel_size_60x_zoom_1x.json   calibration:cal-pixel-size-20260919
#   read noise 1.6 e-         camera_read_noise_dynamicrange.json spec:Kinetix22, 16-bit DynamicRange mode
#   QE 0.96                   camera_qe_at_600nm_from_the_kinetix_graph.json (read off a graph)
#   full well 80000 e-        Kinetix22 datasheet, 16-bit dynamic-range readout (as in kinetix_100x_oil.yaml)
# Not measured: gain (placeholder; 1.25 e-/ADU puts the 80000 e- well at ~64000 ADU, inside 16 bits)
# and offset. Replace both from a photon-transfer series in this mode.
#
#   python scripts/show_system.py configs/ti2_60x.yaml
system:
  name: "Ti2 60x/1.42 oil (MRD71670), Kinetix22 16-bit DR, 605 nm"

  objective:
    na: 1.42
    magnification: 60.0      # 6.5 um / 60 = 0.10833 um/px, matches calibration
    n_immersion: 1.518  # MOCK VALUE, a reseller figure (card 075); the bottle on the bench reads nD 1.5150 at 23 C (store: immersion_oil_in_use_label_index_sodium_d_23c)
    tube_length: 200000.0     # Nikon
    working_distance: 150.0    # um, catalogue 0.15 mm

  camera:
    pixel_size: 6.5           # Kinetix22 pitch (camera_sensor_geometry)
    binning: 1
    qe: 0.96
    read_noise: 1.6
    dark_current: 0.5
    full_well: 80000.0
    bit_depth: 16
    gain: 1.25                # e-/ADU placeholder
    offset: 100.0             # ADU, placeholder
    prnu: 0.005
    hot_pixel_rate: 2.0e-5
    em_gain: 1.0

  stack:
    n_sample: 1.33            # aqueous
    n_immersion: 1.518  # MOCK VALUE, a reseller figure (card 075); the bottle on the bench reads nD 1.5150 at 23 C (store: immersion_oil_in_use_label_index_sodium_d_23c)
    n_immersion_design: 1.518  # MOCK VALUE (card 075); the bottle on the bench reads nD 1.5150 at 23 C (store: immersion_oil_in_use_label_index_sodium_d_23c)
    n_glass: 1.515
    n_glass_design: 1.515
    t_glass: 170.0
    t_glass_design: 170.0
    t_immersion: 150.0
    t_immersion_design: 150.0

  illumination:
    # MOCK VALUE, not a measurement (soft-matter-agents card 075): "605" is the red path's
    # NAME, not a wavelength. The filter on that path is FF01-595/31; the store holds it as
    # red_path_605_is_the_ff01_595_31_filter and filter_ff01_595_31_32_passband. Only the
    # synthetic-image generator reads this; nothing that drives the instrument does.
    wavelength: 0.605         # emission centre, um -- see the note above
    bandwidth: 0.040
    n_spectral: 1
    exposure: 0.02            # 100x Aura GREEN 1 % on 2026-09-30 used 20 ms
    photons_per_emitter: 8000.0
    background: 40.0
